<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLCalculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="nohistory">

                    <path fill="currentColor" fill-rule="evenodd"
                        d="M24 5.05c-9.105 0-14.131.312-16.788.586c-.932.097-1.53.692-1.628 1.638C5.31 9.94 5 14.981 5 24.114c0 9.628.344 15.775.634 19.24l3.433-2.87a2 2 0 0 1 2.7.123l2.932 2.941l3.85-3.089a2 2 0 0 1 2.667.148L24 43.399l2.783-2.792a2 2 0 0 1 2.669-.148l3.85 3.09l2.931-2.942a2 2 0 0 1 2.7-.122l3.433 2.87c.29-3.466.634-9.613.634-19.24c0-3.41-.044-6.252-.112-8.613a64 64 0 0 1-2.17.038c-1.63 0-2.901-.069-3.887-.166c-2.546-.25-4.159-2.263-4.265-4.65a78 78 0 0 1-.066-3.42c0-.733.007-1.466.02-2.143c-2.34-.068-5.152-.11-8.52-.11m22.815 8.263v-.034l-.002-.028c-.047-.865-.584-3.374-4.597-7.4c-3.955-3.967-6.523-4.55-7.433-4.614l-.06-.003C31.967 1.124 28.456 1.05 24 1.05c-9.182 0-14.356.313-17.199.607c-2.825.292-4.906 2.385-5.196 5.207C1.312 9.716 1 14.905 1 24.115c0 9.993.367 16.327.673 19.867c.28 3.24 3.977 4.572 6.34 2.598l2.214-1.852l1.64 1.646a3.996 3.996 0 0 0 5.333.296l2.451-1.967l1.518 1.522a3.996 3.996 0 0 0 5.661 0l1.519-1.522L30.8 46.67a3.996 3.996 0 0 0 5.332-.296l1.64-1.646l2.215 1.852c2.362 1.974 6.06.643 6.34-2.598c.305-3.54.673-9.875.673-19.867c0-4.495-.075-8.03-.185-10.802m-19.981 4.954c1.145-1.075 2.943-1.489 4.31-.287a13 13 0 0 1 1.151 1.15c1.202 1.368.788 3.166-.287 4.311c-.611.65-1.453 1.532-2.594 2.697a181 181 0 0 1 2.594 2.698c1.075 1.145 1.489 2.943.287 4.31a13 13 0 0 1-1.15 1.151c-1.368 1.202-3.166.788-4.311-.287a187 187 0 0 1-2.698-2.594a181 181 0 0 1-2.697 2.594c-1.145 1.075-2.943 1.488-4.31.287a13 13 0 0 1-1.151-1.15c-1.202-1.368-.788-3.166.287-4.311a187 187 0 0 1 2.594-2.698a181 181 0 0 1-2.594-2.697c-1.075-1.145-1.489-2.943-.287-4.31a13 13 0 0 1 1.15-1.151c1.368-1.202 3.166-.788 4.311.287c.65.611 1.532 1.453 2.697 2.594a181 181 0 0 1 2.698-2.594"
                        clip-rule="evenodd" />
                </svg>
                <p class="nohistorytext">No History</p>
            </div>
            <div class="history-items">

            </div>
            <div class="clrhistorybtncontainer">
                <button class="clrhistorybtn">Clear history</button>
            </div>
        </div>
        <div class="topsection">
            <div class="history">
                <button class="btn nborder" id="history-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="50" class="historyicn" height="50"
                        viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M13.26 3C8.17 2.86 4 6.95 4 12H2.21c-.45 0-.67.54-.35.85l2.79 2.8c.2.2.51.2.71 0l2.79-2.8a.5.5 0 0 0-.36-.85H6c0-3.9 3.18-7.05 7.1-7c3.72.05 6.85 3.18 6.9 6.9c.05 3.91-3.1 7.1-7 7.1c-1.61 0-3.1-.55-4.28-1.48a.994.994 0 0 0-1.32.08c-.42.42-.39 1.13.08 1.49A8.86 8.86 0 0 0 13 21c5.05 0 9.14-4.17 9-9.26c-.13-4.69-4.05-8.61-8.74-8.74m-.51 5c-.41 0-.75.34-.75.75v3.68c0 .35.19.68.49.86l3.12 1.85c.36.21.82.09 1.03-.26c.21-.36.09-.82-.26-1.03l-2.88-1.71v-3.4c0-.4-.34-.74-.75-.74" />
                    </svg>
                </button>
            </div>
            <div class="solar">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
        <div class="screen">
            <input type="text" placeholder="00">
        </div>
        <div class="btns-section">
            <button class="btn redtype">AC</button>
            <button class="btn redtype" id="onbtn">ON</button>
            <button class="btn redtype">OFF</button>
            <button class="btn bluetype" id="backspacebtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="m11.4 16l2.6-2.6l2.6 2.6l1.4-1.4l-2.6-2.6L18 9.4L16.6 8L14 10.6L11.4 8L10 9.4l2.6 2.6l-2.6 2.6zM9 20q-.475 0-.9-.213t-.7-.587L2 12l5.4-7.2q.275-.375.7-.587T9 4h11q.825 0 1.413.587T22 6v12q0 .825-.587 1.413T20 20z" />
                </svg>
            </button>
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn greentype" id="divide">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2">
                        <path d="M5 12h14" />
                        <circle cx="12" cy="6" r="1" fill="currentColor" />
                        <circle cx="12" cy="18" r="1" fill="currentColor" />
                    </g>
                </svg>
            </button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn greentype" id="multiply">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="m13.41 12l6.3-6.29a1 1 0 1 0-1.42-1.42L12 10.59l-6.29-6.3a1 1 0 0 0-1.42 1.42l6.3 6.29l-6.3 6.29a1 1 0 0 0 0 1.42a1 1 0 0 0 1.42 0l6.29-6.3l6.29 6.3a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.42Z" />
                </svg>
            </button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn greentype">-</button>
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn">=</button>
            <button class="btn greentype">+</button>
        </div>
    </div>
</body>

</html>
